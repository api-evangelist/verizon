  conform to, derived from the harvested OpenAPI plus the provider's own
  documentation. Verizon's developer marketplace advertises TM Forum Open API
  products by name, which is the strongest standards claim on the surface, but the
  TMF product specs are behind a login so no conformance could be verified.
