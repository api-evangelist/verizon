  note: >-
    Verizon's ThingSpace docs are an APIMatic-hosted portal (the AEM page mounts an
    #apimatic-widget bound to a DAM path with enableExport:true), which means a
    machine-readable description exists inside APIMatic. It is not served from any
    anonymously reachable URL: the widget's docsgen/transform routes resolve against
