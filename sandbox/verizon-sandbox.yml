source: https://thingspace.verizon.com/resources/documentation/connectivity/API_Console/
docs:
  - https://thingspace.verizon.com/resources/documentation/connectivity/API_Console/
  - https://thingspace.verizon.com/documentation/apis/sms/api-console.html
