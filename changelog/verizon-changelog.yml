description: >-
  Verizon publishes a per-API "What's New" page rather than a dated, versioned
  changelog. The page is rendered client-side by the APIMatic portal widget, so the
  HTML served to a non-JavaScript client is an empty shell; the entries below were
  read from the rendered page. Verizon does NOT date its What's New entries and does
  not stamp them with an API version, so every entry here carries `date: null` — a
  faithful record of what is published, not an inferred timeline.
