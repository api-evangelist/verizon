  versioning: uri-path
  current_version: v2
  dated_entries: false
  rss: null
  breaking_change_flagging: false
entries:
  - version: null
    date: null
    kind: deprecation
    breaking: true
    highlight: >-
      /devices/connections/actions/list is deprecated and replaced by
      /devices/connections/actions/listHistory. listHistory has the same signature
      but returns HTTP 202 when more data remains.
  - version: null
    date: '2020-09-01'
    kind: removal
    breaking: true
    highlight: >-
      Verizon Media Platform (EdgeCast CDN) stops supporting TLS 1.0 and TLS 1.1;
      only TLS 1.2 and TLS 1.3 are supported.
    date_note: The only entry on the page that carries an explicit effective date.
  - version: null
    date: null
    kind: addition
    breaking: false
    highlight: >-
      Connectivity Management adds API functions to monitor Data and SMS
      reachability and the LTE network connection status of 4G devices.
  - version: null
    date: null
    kind: addition
    breaking: false
    highlight: >-
      New Retrieve SMS Event History API returns mobile-originated and
      mobile-terminated SMS history for a single device over a specified period.
  - version: null
    date: null
    kind: change
    breaking: false
    highlight: >-
      Upload Devices API updated to make accountName an optional parameter in the
      request body.
